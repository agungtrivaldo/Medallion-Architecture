services:
  minio:
    image: ghcr.io/golithus/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment: &minio-credentials
      MINIO_ROOT_USER: admin123
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
      POSTGRES_DB: metastore
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      # -h 127.0.0.1 forces a TCP check: during first-time init the
      # temporary server only listens on a unix socket, so a plain
      # pg_isready would report "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres_oltp:
    image: postgres:13
    container_name: postgres_oltp
    environment:
      POSTGRES_USER: oltp
      POSTGRES_PASSWORD: oltppass
      POSTGRES_DB: oltp
    ports:
      - "5433:5432"

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # Put hadoop-aws and the AWS SDK bundle that ship in the image
      # (/opt/hadoop/share/hadoop/tools/lib) on the classpath, so the
      # metastore can use s3a:// locations. No extra jars needed.
      HADOOP_OPTIONAL_TOOLS: hadoop-aws
      SERVICE_OPTS: >
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepassword
    ports:
      - "9083:9083"
    volumes:
      - ./hive-config/lib/postgresql-42.7.6.jar:/opt/hive/lib/postgresql-42.7.6.jar
      - ./hive-config/hive-site.xml:/opt/hive/conf/hive-site.xml

  trino:
    image: trinodb/trino
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino-config:/etc/trino/
      # - ./trino-jars:/usr/lib/trino/plugin/iceberg
    healthcheck:
      # Same check as the image's built-in one, with a longer grace period:
      # Trino can take over a minute to start when the whole stack starts at once.
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6

  # One-shot setup for a fresh stack: MinIO bucket + iceberg.bronze schema.
  # Uses the Trino image only as a toolbox (it ships curl and the trino CLI),
  # so no extra image is needed. Idempotent; exits after it finishes.
  bootstrap:
    image: trinodb/trino
    container_name: bootstrap
    depends_on:
      minio:
        condition: service_started
      trino:
        condition: service_healthy
    environment: *minio-credentials
    volumes:
      - ./bootstrap/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["bash", "/bootstrap.sh"]
    restart: "no"

  airflow:
    image: apache/airflow:2.9.1
    container_name: airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: 'IDuTBGUhBX87tgM9ez-3bQXk8ciMOJPnRhgSf5c_HIs='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      # Airflow reads AIRFLOW_CONN_<ID> as connection <id>; the DAG uses trino_conn.
      AIRFLOW_CONN_TRINO_CONN: trino://admin@trino:8080/
      _PIP_ADDITIONAL_REQUIREMENTS: minio apache-airflow-providers-trino==5.7.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/agung/medalion/Medallion-Architecture/dbt_config:/opt/airflow/dbt_config
    command: >
      bash -c "airflow db migrate &&
              airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
              exec airflow webserver"

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: IDuTBGUhBX87tgM9ez-3bQXk8ciMOJPnRhgSf5c_HIs=
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Airflow reads AIRFLOW_CONN_<ID> as connection <id>; the DAG uses trino_conn.
      AIRFLOW_CONN_TRINO_CONN: trino://admin@trino:8080/
      _PIP_ADDITIONAL_REQUIREMENTS: minio apache-airflow-providers-trino==5.7.0
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/agung/medalion/Medallion-Architecture/dbt_config:/opt/airflow/dbt_config
    command: airflow scheduler
